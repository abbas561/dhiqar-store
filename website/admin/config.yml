backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "صورة المنتج", name: "image", widget: "image" }
      - { label: "الوصف", name: "description", widget: "text" }
      - { label: "السعر ($)", name: "price", widget: "number", value_type: "float" }
      - { label: "الكمية المتوفرة", name: "quantity", widget: "number", default: 1 }
      - { label: "غير متوفر بالمتجر", name: "out_of_stock", widget: "boolean", default: false }

      # القسم الرئيسي
      - label: "القسم الرئيسي"
        name: "category"
        widget: "select"
        options:
          - "الملابس والأزياء"
          - "الأجهزة والتمريض الطبي"
          - "العدد والأدوات اليدوية"
          - "مستلزمات التجميل والعناية"
          - "أدوات وأجهزة المطبخ"
          - "الإنارة والإضاءة الحديثة"
          - "الحاسبات وقطع التجميع"
          - "الشاشات وأجهزة العرض"
          - "الكونسول واليديات والألعاب"
          - "الراوترات وأنظمة الشبكات"
          - "الطاقة والبطاريات وUPS"
          - "الخرائط والإلكترونيات"
          - "الساعات والإكسسوارات"
          - "ألعاب ومستلزمات الأطفال"

      # القسم الفرعي
      - label: "القسم الفرعي"
        name: "subcategory"
        widget: "select"
        options:
          # الملابس والأزياء
          - "ملابس رجالية"
          - "ملابس نسائية"
          - "ملابس أطفال"
          - "الأحذية والحقائب"

          # الأجهزة والتمريض الطبي
          - "أجهزة قياس الضغط والسكر"
          - "أجهزة النبض والمحرار الحراري"
          - "أجهزة تبخير وعلاج التنفس"
          - "مستلزمات العناية الصحية والتدليك"

          # العدد والأدوات اليدوية
          - "المفكات، الملاقط والكالبات"
          - "أجهزة ومفكات شحن كهربائية"
          - "أجهزة ومستلزمات اللحام الإلكتروني"
          - "أجهزة القياس والفحص الدقيق"

          # مستلزمات التجميل والعناية
          - "أجهزة سشوار وتسريح الشعر"
          - "ماكينات الحلاقة والعناية الشخصية"
          - "أدوات العناية بالبشرة والوجه"

          # أدوات وأجهزة المطبخ
          - "أجهزة المطبخ الكهربائية"
          - "أواني وأدوات الطبخ الحديثة"
          - "صانعات القهوة والمشروبات"

          # الإنارة والإضاءة الحديثة
          - "إضاءة RGB والإنارة الذكية"
          - "مصابيح المكاتب والشحن LED"
          - "الكشافات والإنارة الخارجية"

          # الحاسبات وقطع التجميع
          - "أجهزة المني بيسي (Mini PC)"
          - "المعالجات (CPUs)"
          - "كروت الشاشة (GPUs)"
          - "المذربوردات (Motherboards)"
          - "الرامات والتخزين (RAM & SSD)"
          - "التبريد ومزودات الطاقة (PSU)"

          # الشاشات وأجهزة العرض
          - "شاشات القيمنق المنحنية (OLED/Ultrawide)"
          - "الشاشات المحمولة (Portable Display)"

          # الكونسول واليديات والألعاب
          - "أجهزة المحاكاة والألعاب القديمة (Retro)"
          - "يديات التحكم المغناطيسية (Hall Effect)"
          - "كيبوردات الجيمنج والماوسات"

          # الراوترات وأنظمة الشبكات
          - "راوترات OpenWrt وتوزيع الحمل"
          - "راوترات Wi-Fi 6/7 وأجهزة 5G CPE"
          - "السويتشات والمقويات والكبسولات"

          # الطاقة والبطاريات وUPS
          - "لوحات إدارة البطاريات (BMS)"
          - "خلايا بطاريات الليثيوم"
          - "أجهزة UPS والمحولات الكهربائية"

          # الخرائط والإلكترونيات
          - "أجهزة الميكروکنترولر وRaspberry Pi"
          - "الخرائط الإلكترونية وقطع الصيانة"

          # الساعات والإكسسوارات
          - "الساعات الكرونوغراف والأنيقة"
          - "المسابح والحجر الطبيعي (اليسر)"

          # ألعاب ومستلزمات الأطفال
          - "الألعاب الذكية والتعليمية"
          - "مستلزمات الأطفال العامة"
