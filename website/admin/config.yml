<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأقسام | امزون ذي قار</title>
    <!-- Bootstrap RTL CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-primary: #f3a847;
            --brand-secondary: #e47911;
            --dark-header: #11161d;
            --sub-header: #1d2531;
            --bg-light: #f4f5f7;
        }

        body {
            background-color: var(--bg-light);
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 70px;
        }

        .main-header {
            background-color: var(--dark-header);
            border-bottom: 2px solid var(--brand-primary);
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e2e2;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        .img-box {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #fff;
            border-radius: 6px;
        }

        .img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .btn-whatsapp-order {
            background-color: #25d366;
            color: white !important;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            padding: 8px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="main-header py-3 text-white text-center">
        <a href="index.html" class="text-white text-decoration-none h3 fw-bold">
            امزون <span style="color: var(--brand-primary);">ذي قار</span>
        </a>
    </header>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold" id="categoryTitle">جاري تحميل القسم...</h4>
            <a href="index.html" class="btn btn-outline-dark btn-sm"><i class="fas fa-arrow-right me-1"></i> العودة للرئيسية</a>
        </div>

        <!-- حاوية المنتجات -->
        <div class="row g-3" id="productsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted">جاري تصفية المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.min.js"></script>

    <script>
        async function loadCategoryProducts() {
            const container = document.getElementById('productsContainer');
            const categoryTitleEl = document.getElementById('categoryTitle');

            // قراءة نوع القسم من رابط الصفحة (مثلاً category.html?type=controllers)
            const urlParams = new URLSearchParams(window.location.search);
            const selectedCategory = urlParams.get('type') || 'all';

            categoryTitleEl.textContent = selectedCategory === 'all' ? 'جميع المنتجات' : `قسم: ${selectedCategory}`;

            try {
                const repoOwner = "abbas561";
                const repoName = "dhiqar-store";
                const folderPath = "content/products";
                const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("تعذر الوصول لبيانات المنتجات.");

                const files = await response.json();
                container.innerHTML = '';
                let productCount = 0;

                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const rawRes = await fetch(file.download_url);
                        const rawText = await rawRes.text();
                        const yamlMatch = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---/);

                        if (yamlMatch && yamlMatch[1]) {
                            const data = jsyaml.load(yamlMatch[1]);
                            
                            // فلترة المنتجات حسب القسم (أو عرض الكل إذا كان الاختيار all)
                            const productCategory = data.category || data.type || '';
                            if (selectedCategory === 'all' || productCategory === selectedCategory) {
                                
                                const title = data.title || 'منتج بدون عنوان';
                                const price = data.price ? `$${data.price}` : 'اتصل بالسعر';
                                const image = data.image || 'https://via.placeholder.com/300';
                                const whatsappMsg = encodeURIComponent(`السلام عليكم، أرغب في استفسار/طلب: ${title}`);

                                container.innerHTML += `
                                    <div class="col-6 col-md-3">
                                        <div class="product-card p-2 h-100 d-flex flex-column justify-content-between">
                                            <div>
                                                <div class="img-box">
                                                    <img src="${image}" alt="${title}" onerror="this.src='https://via.placeholder.com/300'">
                                                </div>
                                                <h6 class="fw-bold fs-6 mb-1 mt-2 text-truncate" title="${title}">${title}</h6>
                                                <p class="text-warning fw-bold small mb-2">${price}</p>
                                            </div>
                                            <a href="https://wa.me/9647822980189?text=${whatsappMsg}" target="_blank" class="btn btn-whatsapp-order text-center text-decoration-none">
                                                <i class="fab fa-whatsapp me-1"></i> طلب عبر واتساب
                                            </a>
                                        </div>
                                    </div>
                                `;
                                productCount++;
                            }
                        }
                    }
                }

                if (productCount === 0) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-5">لا توجد منتجات مضافة في هذا القسم حالياً.</div>`;
                }

            } catch (error) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-5">${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCategoryProducts);
    </script>
</body>
