<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امزون ذي قار</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #f3a847;
            --brand-secondary: #e47911;
            --dark-header: #11161d;
            --sub-header: #1d2531;
            --bg-light: #f4f5f7;
        }

        body {
            background-color: var(--bg-light);
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 70px;
        }

        .main-header {
            background-color: var(--dark-header);
            border-bottom: 2px solid var(--brand-primary);
        }

        .sub-header {
            background-color: var(--sub-header);
        }

        .btn-categories-menu {
            background-color: var(--brand-primary);
            color: #11161d !important;
            font-weight: bold;
            border-radius: 6px;
            padding: 8px 18px;
            border: none;
        }

        .offcanvas-header {
            background-color: var(--dark-header);
            color: #fff;
            border-bottom: 2px solid var(--brand-primary);
        }

        .sidebar-accordion .accordion-button {
            padding: 12px 15px;
            font-weight: 600;
            color: #333;
            background: transparent;
            box-shadow: none;
        }

        .sidebar-accordion .accordion-button:not(.collapsed) {
            color: var(--brand-secondary);
            background-color: #fff8ef;
        }

        .sub-category-link {
            display: block;
            padding: 10px 12px;
            color: #444 !important;
            font-size: 0.95rem;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .sub-category-link:hover {
            background-color: #ffe6cb;
            color: var(--brand-secondary) !important;
            font-weight: bold;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e2e2;
        }

        .img-box {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .btn-whatsapp-order {
            background-color: #25d366;
            color: white !important;
            font-weight: bold;
            border-radius: 6px;
        }

        .section-title {
            position: relative;
            padding-bottom: 8px;
            font-weight: 800;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 3px;
            background-color: var(--brand-primary);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="main-header py-3 text-white text-center">
        <h3 class="fw-bold m-0">امزون <span style="color: var(--brand-primary);">ذي قار</span></h3>
    </header>

    <!-- Sub Header -->
    <div class="sub-header py-2 text-white">
        <div class="container d-flex justify-content-between align-items-center">
            <button class="btn btn-categories-menu" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="fas fa-bars me-2"></i> جميع الأقسام
            </button>
            <button onclick="filterCategory('all', 'جميع المنتجات')" class="btn btn-outline-light btn-sm">عرض الكل</button>
        </div>
    </div>

    <!-- Sidebar Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold"><i class="fas fa-list text-warning me-2"></i>أقسام المتجر</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="accordion accordion-flush sidebar-accordion" id="categoryAccordion">

                <div class="accordion-item border-bottom">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#acc-gaming">
                            <i class="fas fa-gamepad text-warning me-2"></i> الكونسول واليديات والألعاب
                        </button>
                    </h2>
                    <div id="acc-gaming" class="accordion-collapse collapse show" data-bs-parent="#categoryAccordion">
                        <div class="accordion-body">
                            <span onclick="filterCategory('controllers', 'يديات التحكم')" class="sub-category-link" data-bs-dismiss="offcanvas"><i class="fas fa-angle-left me-2"></i> يديات التحكم</span>
                            <span onclick="filterCategory('retro-consoles', 'أجهزة المحاكاة والريترو')" class="sub-category-link" data-bs-dismiss="offcanvas"><i class="fas fa-angle-left me-2"></i> أجهزة المحاكاة والريترو</span>
                        </div>
                    </div>
                </div>

                <div class="accordion-item border-bottom">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#acc-pc">
                            <i class="fas fa-desktop text-warning me-2"></i> الحاسبات والتجميعات
                        </button>
                    </h2>
                    <div id="acc-pc" class="accordion-collapse collapse" data-bs-parent="#categoryAccordion">
                        <div class="accordion-body">
                            <span onclick="filterCategory('mini-pc', 'أجهزة Mini PC')" class="sub-category-link" data-bs-dismiss="offcanvas"><i class="fas fa-angle-left me-2"></i> أجهزة Mini PC</span>
                            <span onclick="filterCategory('hardware', 'قطع الحاسوب والتجميعات')" class="sub-category-link" data-bs-dismiss="offcanvas"><i class="fas fa-angle-left me-2"></i> القطع والتجميعات</span>
                        </div>
                    </div>
                </div>

                <div class="accordion-item border-bottom">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#acc-routers">
                            <i class="fas fa-wifi text-warning me-2"></i> الراوترات والشبكات
                        </button>
                    </h2>
                    <div id="acc-routers" class="accordion-collapse collapse" data-bs-parent="#categoryAccordion">
                        <div class="accordion-body">
                            <span onclick="filterCategory('routers', 'الراوترات والشبكات')" class="sub-category-link" data-bs-dismiss="offcanvas"><i class="fas fa-angle-left me-2"></i> الراوترات والمقويات</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Products Container -->
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title m-0" id="displayTitle">جميع المنتجات</h4>
        </div>

        <div class="row g-3" id="productsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let allProducts = [];

        function parseFrontMatter(text) {
            const result = {};
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!match) return result;

            const lines = match[1].split('\n');
            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    let value = parts.slice(1).join(':').trim();
                    value = value.replace(/^["']|["']$/g, '');
                    result[key] = value;
                }
            });
            return result;
        }

        async function fetchProducts() {
            const container = document.getElementById('productsContainer');
            try {
                const repoOwner = "abbas561";
                const repoName = "dhiqar-store";
                const folderPath = "content/products";
                const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("تعذر جلب المنتجات");

                const files = await response.json();
                allProducts = [];

                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const rawRes = await fetch(file.download_url);
                        const rawText = await rawRes.text();
                        const data = parseFrontMatter(rawText);

                        if (data.title && !allProducts.some(p => p.title === data.title)) {
                            allProducts.push(data);
                        }
                    }
                }

                renderProducts(allProducts);

            } catch (err) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-4">${err.message}</div>`;
            }
        }

        function renderProducts(list) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-5">لا توجد منتجات متوفرة في هذا القسم.</div>`;
                return;
            }

            list.forEach(data => {
                const title = data.title;
                const price = data.price ? `$${data.price}` : 'اتصل بالسعر';
                const image = data.image || 'https://via.placeholder.com/300';
                const whatsappMsg = encodeURIComponent(`السلام عليكم، أرغب في استفسار/طلب: ${title}`);

                container.innerHTML += `
                    <div class="col-6 col-md-3">
                        <div class="product-card p-2 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="img-box"><img src="${image}" alt="${title}" onerror="this.src='https://via.placeholder.com/300'"></div>
                                <h6 class="fw-bold fs-6 mb-1 mt-2 text-truncate" title="${title}">${title}</h6>
                                <p class="text-warning fw-bold small mb-2">${price}</p>
                            </div>
                            <a href="https://wa.me/9647822980189?text=${whatsappMsg}" target="_blank" class="btn btn-whatsapp-order text-center text-decoration-none py-2">
                                <i class="fab fa-whatsapp me-1"></i> طلب عبر واتساب
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(catKey, catName) {
            document.getElementById('displayTitle').textContent = catName;

            if (catKey === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === catKey || p.type === catKey);
                renderProducts(filtered);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
